# Local PostgreSQL for development. Run from the repository root:
#   docker compose --env-file .env -f infra/compose/docker-compose.yml up -d
# Credentials come from .env; they only take effect when the data volume is first created.
name: medsafe

services:
  postgres:
    image: postgres:16
    container_name: medsafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    ports:
      # 5433 on the host leaves 5432 free for a native PostgreSQL install
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    # Same volume the original stand-alone compose file created, so existing data is kept
    name: postgresql_medsafe_pgdata
