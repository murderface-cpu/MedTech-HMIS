name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medsafe
          POSTGRES_USER: medsafe
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medsafe -d medsafe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_NAME: medsafe
      DATABASE_USER: medsafe
      DATABASE_PASSWORD: ci-only-password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      HOSPITAL_NAME: CI HOSPITAL
      APPLICATION_NAME: MedSafe Health Management Information System
      CURRENCY: KES
      TIME_ZONE: Africa/Nairobi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: System checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date
        run: |
          python manage.py generateschema --format openapi --title "MedSafe HMIS API" --api_version v1 --file /tmp/openapi.yaml
          diff -u docs/openapi/openapi.yaml /tmp/openapi.yaml
      - name: Tests
        run: python manage.py test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hmis
          POSTGRES_USER: medsafe
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medsafe -d hmis"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HMIS_DATABASE_URL: postgresql+psycopg://medsafe:ci-only-password@localhost:5432/hmis
      HMIS_TEST_DATABASE_URL: postgresql+psycopg://medsafe:ci-only-password@localhost:5432/hmis_test
      HMIS_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Migrations apply to an empty database
        run: uv run alembic upgrade head
      - name: Create the test database
        run: PGPASSWORD=ci-only-password psql -h localhost -U medsafe -d hmis -c "CREATE DATABASE hmis_test"
      - name: Tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build the PWA
        run: npm run generate
