name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medsafe
          POSTGRES_USER: medsafe
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medsafe -d medsafe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_KEY: ci-only-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_NAME: medsafe
      DATABASE_USER: medsafe
      DATABASE_PASSWORD: ci-only-password
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      HOSPITAL_NAME: CI HOSPITAL
      APPLICATION_NAME: MedSafe Health Management Information System
      CURRENCY: KES
      TIME_ZONE: Africa/Nairobi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: System checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date
        run: |
          python manage.py generateschema --format openapi --title "MedSafe HMIS API" --api_version v1 --file /tmp/openapi.yaml
          diff -u docs/openapi/openapi.yaml /tmp/openapi.yaml
      - name: Tests
        run: python manage.py test --noinput
