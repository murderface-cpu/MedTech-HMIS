{% load static %}
<div class="modal-section">
    <div class="section-label">
        <small>Patient</small>
    </div>
    <div class="section-content">
        <div class="flex flex-gap-40">
            <div class="form-control flex flex-column">
                <label>Patient ID</label>
                <input class="input" type="text" data-field="patient_id" readonly />
            </div>
            <div class="form-control flex flex-column">
                <label>Full name</label>
                <input class="input" type="text" data-field="fullname" readonly />
            </div>
            <div class="form-control flex flex-column">
                <label>Gender</label>
                <input class="input" type="text" data-field="gender" readonly />
            </div>
            <div class="form-control flex flex-column">
                <label>Age</label>
                <input class="input" type="text" data-field="age" readonly />
            </div>
        </div>
        <div class="flex">
            <button type="button" class="accented load_patient_activator">Select patient</button>
        </div>
    </div>
</div>
