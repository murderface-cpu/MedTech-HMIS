{% load static %}

<div class="modal" id="create_triage_modal" role="dialog" aria-modal="true" aria-labelledby="create_triage_modal_title">
    <div class="modal-header">
        <h3 class="modal-title" id="create_triage_modal_title" data-create-title="Create triage" data-edit-title="Edit triage">Create triage</h3>
        <button type="button" class="icon-button" data-close-modal aria-label="Close"><i class="fa fa-times" aria-hidden="true"></i></button>
    </div>
    <div class="modal-body">
        <form>
        {% include "./_patient_summary.html" %}
        {% include "./_triage_fields.html" %}
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" data-close-modal>Cancel</button>
        <button type="button" class="accented" data-submit="triage">Save triage</button>
    </div>
</div>
