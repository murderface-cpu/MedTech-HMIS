{% with widget=field.field.widget %}
<div class="form-control flex flex-column{% if widget.allow_multiple_selected and widget.input_type == 'checkbox' %} multiple-choice{% elif widget.input_type == 'checkbox' %} checkbox-control{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}
</div>
{% endwith %}
