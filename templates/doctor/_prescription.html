<section class="variable-section" id="prescription">
  <form id="prescription_form" class="section-form app-form">
    <div class="form-grid">
      <div class="form-control flex flex-column">
        <label for="prescription_drug">Drug</label>
        <select class="input" id="prescription_drug" name="drug" required>
          <option value="">Select drug</option>
        </select>
      </div>
      <div class="form-control flex flex-column">
        <label for="prescription_dosage">Dosage</label>
        <input class="input" type="text" id="prescription_dosage" name="dosage" maxlength="256" placeholder="1 x 3">
      </div>
      <div class="form-control flex flex-column">
        <label for="prescription_duration">Duration</label>
        <input class="input" type="text" id="prescription_duration" name="duration" maxlength="256" placeholder="5 days">
      </div>
      <div class="form-control flex flex-column">
        <label for="prescription_quantity">Quantity</label>
        <input class="input" type="number" min="1" step="1" id="prescription_quantity" name="quantity" required>
      </div>
      <div class="form-control flex flex-column">
        <label for="prescription_notes">Notes</label>
        <textarea class="input" id="prescription_notes" name="notes" rows="2"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <small id="prescription_stock"></small>
      <button type="submit" class="accented">Prescribe</button>
    </div>
  </form>
  <table id="prescription_table" class="display" style="width:100%">
    <thead>
      <tr>
        <th>Drug</th><th>Dosage</th><th>Duration</th><th>Quantity</th><th>Issued</th>
        <th>Stock left</th><th>Price ({{ currency }})</th><th>Amount ({{ currency }})</th><th>Prescribed by</th><th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
