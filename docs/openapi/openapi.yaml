components:
  schemas:
    Patient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        firstname:
          type: string
          maxLength: 256
        middlename:
          type: string
          nullable: true
          maxLength: 256
        lastname:
          type: string
          maxLength: 256
        age:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        date_of_birth:
          type: string
          format: date-time
          nullable: true
        nin:
          type: string
          nullable: true
          maxLength: 256
        gender:
          enum:
          - Male
          - Female
          type: string
        telnumber:
          type: string
          maxLength: 256
        alttelnumber:
          type: string
          nullable: true
          maxLength: 256
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        address:
          type: string
          nullable: true
          maxLength: 256
        slug:
          type: string
          readOnly: true
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
        created_on:
          type: string
          format: date-time
          readOnly: true
        updated_on:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        patient_id:
          type: string
          readOnly: true
          nullable: true
      required:
      - firstname
      - lastname
      - gender
      - telnumber
    PatientNok:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        firstname:
          type: string
          maxLength: 256
        middlename:
          type: string
          nullable: true
          maxLength: 256
        lastname:
          type: string
          maxLength: 256
        age:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        date_of_birth:
          type: string
          format: date-time
          nullable: true
        nin:
          type: string
          nullable: true
          maxLength: 256
        gender:
          enum:
          - Male
          - Female
          type: string
        telnumber:
          type: string
          maxLength: 256
        alttelnumber:
          type: string
          nullable: true
          maxLength: 256
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        address:
          type: string
          nullable: true
          maxLength: 256
        slug:
          type: string
          readOnly: true
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
        created_on:
          type: string
          format: date-time
          readOnly: true
        updated_on:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        relationship:
          enum:
          - Husband
          - Wife
          - Father
          - Mother
          - Brother
          - Sister
          - Son
          - Daughter
          - Guardian
          - Other
          type: string
      required:
      - patient
      - firstname
      - lastname
      - gender
      - telnumber
      - relationship
    Visit:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        patient:
          type: integer
        billing_type:
          type: integer
          writeOnly: true
          nullable: true
        insurance_company:
          type: integer
          writeOnly: true
          nullable: true
        account_company:
          type: integer
          writeOnly: true
          nullable: true
        visit_id:
          type: string
          readOnly: true
          nullable: true
        complete:
          type: boolean
        updated_on:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_on:
          type: string
          format: date-time
          readOnly: true
        visit_date:
          type: string
          format: date-time
        doctor:
          type: integer
          nullable: true
        category:
          type: integer
        speciality:
          type: integer
          nullable: true
        billing:
          type: string
          readOnly: true
          nullable: true
      required:
      - patient
      - category
    Triage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        visit:
          type: integer
        blood_pressure:
          type: string
          nullable: true
          maxLength: 16
        heart_rate:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          nullable: true
        respiratory_rate:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          nullable: true
        temperature:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          nullable: true
        weight:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          nullable: true
        height:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          nullable: true
        oxygen_saturation:
          type: string
          format: decimal
          multipleOf: 0.01
          maximum: 10000
          minimum: -10000
          nullable: true
