openapi: 3.0.2
info:
  title: MedSafe HMIS API
  version: v1
paths:
  /api/v1/:
    get:
      operationId: listApiRoots
      description: Entry point of the versioned API; the frontend reads its URL to
        build every request.
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items: {}
          description: ''
      tags:
      - api
  /api/v1/patients/:
    get:
      operationId: listPatients
      description: ''
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
          description: ''
      tags:
      - api
  /api/v1/patients/{patient_id}/:
    get:
      operationId: retrievePatient
      description: ''
      parameters:
      - name: patient_id
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
